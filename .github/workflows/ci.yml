name: CI

on:
  push:
    branches: [main, "fix/**", "hardening/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI (Python 3.10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: contextshield
          POSTGRES_PASSWORD: contextshield_test
          POSTGRES_DB: contextshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextshield -d contextshield_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Code Quality & Syntax Validation (Ruff)
        run: |
          python -m ruff check .

      - name: Secret exposure audit
        run: |
          python scripts/audit_secrets.py

      - name: Run unit and regression tests
        env:
          AUDIT_STORE: memory
        run: |
          python -m pytest -v

      - name: Run Alembic migrations against PostgreSQL
        env:
          AUDIT_STORE: postgres
          DATABASE_URL: postgresql+asyncpg://contextshield:contextshield_test@localhost:5432/contextshield_test
        run: |
          python -m alembic upgrade head

      - name: Run PostgreSQL persistence integration tests
        env:
          AUDIT_STORE: postgres
          DATABASE_URL: postgresql+asyncpg://contextshield:contextshield_test@localhost:5432/contextshield_test
        run: |
          python -m pytest -v -m postgres

  frontend:
    name: Frontend CI (Node 22)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Lint check (ESLint)
        run: npm run lint

      - name: Production build (Next.js)
        run: npm run build
